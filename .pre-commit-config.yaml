# `dms/public/frontend/_next` is the committed Next.js build output that
# `bench build` copies in. It is machine-generated, so no hook should read,
# reformat or lint it.
exclude: 'node_modules|.git|dms/public/frontend/_next'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "dms.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                dms/public/dist/.*|
                dms/public/frontend/_next/.*|
                .*node_modules.*|
                .*boilerplate.*|
                dms/templates/includes/.*|
                dms/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                dms/public/dist/.*|
                dms/public/frontend/_next/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                dms/templates/includes/.*|
                dms/public/js/lib/.*
            )$

  # Repo-local checks. These read the files a fresh `bench install-app dms` takes
  # straight off disk, so a broken JSON is caught at commit time instead of in CI
  # or on a customer's first install. See scripts/check_doctype_json.py.
  - repo: local
    hooks:
      - id: check-doctype-json
        name: "Check DocType JSON (fresh-install safety)"
        entry: python3 scripts/check_doctype_json.py
        language: system
        files: '^dms/.+/doctype/.+\.json$'
        # Validate every DocType in the app whenever one of them changes: the
        # checks are properties of the whole schema, not of the edited file.
        pass_filenames: false


ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
