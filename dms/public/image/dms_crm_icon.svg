<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="DMS CRM icon">
  <!-- DMS dark-mode background (#0A2A3F) -->
  <defs>
    <linearGradient id="dmsCrmBg" x1="32" y1="20" x2="224" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A2A3F"/>
      <stop offset="1" stop-color="#081E2D"/>
    </linearGradient>
    <linearGradient id="dmsCrmAccent" x1="70" y1="70" x2="190" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42A5F5"/>
      <stop offset="1" stop-color="#1E88E5"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#dmsCrmBg)"/>
  <!-- Soft navy card glow -->
  <circle cx="128" cy="118" r="86" fill="#0F3D5E" opacity="0.55"/>
  <!-- Accent disc -->
  <circle cx="128" cy="118" r="62" fill="url(#dmsCrmAccent)"/>
  <circle cx="108" cy="98" r="28" fill="rgba(255,255,255,0.18)"/>
  <!-- Simple people / CRM mark -->
  <circle cx="108" cy="108" r="14" fill="#FFFFFF"/>
  <circle cx="150" cy="112" r="11" fill="#F5F7FA" opacity="0.92"/>
  <path d="M78 158c8-22 24-34 50-34s42 12 50 34" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <!-- Gold CRM badge strip (DMS gold) -->
  <rect x="48" y="186" width="160" height="36" rx="18" fill="#F5C518"/>
  <text
    x="128"
    y="211"
    text-anchor="middle"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="2"
    fill="#0A2A3F"
  >CRM</text>
</svg>
